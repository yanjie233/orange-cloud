name: Android OSS APK

# 自编译（oss 风味，全 Pro 解锁）云编译：
# 需要的两个仓库 Secret：
#   OAUTH_CLIENT_ID     —— 你在 Cloudflare Dashboard 建的 OAuth client 的 client_id
#   OAUTH_REDIRECT_URI  —— 你自建的回调中转 https 地址，例如 https://oc-relay.<sub>.workers.dev/oauth/callback
# 都没配也能编译，只是登录会失败（client_id 为空串）。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Inject OAuth client + relay
        working-directory: apps/android
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI }}
        run: |
          printf 'sdk.dir=%s\nOAUTH_CLIENT_ID=%s\n' "$ANDROID_HOME" "$OAUTH_CLIENT_ID" > local.properties
          if [ -n "$OAUTH_REDIRECT_URI" ]; then
            sed -i "s|const val REDIRECT_URI = \"[^\"]*\"|const val REDIRECT_URI = \"$OAUTH_REDIRECT_URI\"|" \
              app/src/main/kotlin/jiamin/chen/orangecloud/core/auth/OAuthConfig.kt
          fi

      - name: Assemble oss debug
        working-directory: apps/android
        run: ./gradlew :app:assembleOssDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: orange-cloud-oss-apk
          path: apps/android/app/build/outputs/apk/oss/debug/*.apk
