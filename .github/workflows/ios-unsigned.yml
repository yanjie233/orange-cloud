name: iOS unsigned IPA

# 目的：产出**未签名**的 iOS 包（自编译全解锁），供你自己用 Sideloadly / AltStore /
# TrollStore / 自签工具重签后安装。需要 Xcode 26 → 用 macos-26 runner。
#
# 关键参数：
#   CODE_SIGNING_ALLOWED=NO / CODE_SIGN_IDENTITY=""  → 不签名
#   DEVELOPMENT_TEAM=""                              → 不碰作者团队
#   SWIFT_ACTIVE_COMPILATION_CONDITIONS=OPENSOURCE_UNLOCKED → 解锁全部 Pro 功能

on:
  workflow_dispatch:
  push:
    branches: ["ios/unsigned-build"]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iOS|watchOS" || true

      - name: Build (unsigned, Release)
        working-directory: apps/ios/Orange Cloud
        run: |
          set -o pipefail
          # -jobs 2：macOS 标准 runner 只有 3 核 / 7GB，默认并行度会把 swift-frontend 打爆
          xcodebuild \
            -project "Orange Cloud.xcodeproj" \
            -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) OPENSOURCE_UNLOCKED' \
            SWIFT_COMPILATION_MODE=singlefile \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=60000' \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show failure summary
        if: failure()
        run: |
          grep -nE "error:|BUILD FAILED|The following build commands failed|Command .* failed" "$RUNNER_TEMP/build.log" | tail -40 || tail -80 "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore

      - name: Package unsigned ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Orange Cloud.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/out/Payload"
          cp -R "$APP" "$RUNNER_TEMP/out/Payload/"
          cd "$RUNNER_TEMP/out"
          zip -qry OrangeCloud-unsigned.ipa Payload
          # 供重签时参考：App 内嵌的 entitlement 模板
          find "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos" -name "*.entitlements" -exec cp {} "$RUNNER_TEMP/out/" \; || true
          ls -lh "$RUNNER_TEMP/out"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          lipo -archs "$APP/Orange Cloud" || file "$APP/Orange Cloud"

      - uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
